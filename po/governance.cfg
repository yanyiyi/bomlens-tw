# po4a configuration for the Traditional Chinese governance documents.
#
# The .zh-TW.md files are GENERATED from po/governance/zh-TW.po, which Weblate
# maintains. Do not hand-edit them -- `scripts/update-po.sh` overwrites them.
#
# Separate from po/docs.cfg on purpose. These are not site pages, so an
# untranslated one cannot fall back to English the way mkdocs-static-i18n does
# for a missing page: the file either exists or the link is dead. Hence -k 0
# (always write) instead of the docs' -k 80.
#
# Korean is not listed -- the .ko.md files stay hand-maintained upstream.
#
# README.md, SUPPORT.md and CHANGELOG.md are absent by design: upstream has no
# Korean translation of them either, and this fork follows that choice.
[po4a_langs] zh-TW
[po4a_paths] po/governance/governance.pot $lang:po/governance/$lang.po
[options] opt:"-o markdown -w 9999 -k 0"

[type: text] CONTRIBUTING.md $lang:CONTRIBUTING.$lang.md
[type: text] SECURITY.md $lang:SECURITY.$lang.md
[type: text] CODE_OF_CONDUCT.md $lang:CODE_OF_CONDUCT.$lang.md
[type: text] THIRD_PARTY_LICENSES.md $lang:THIRD_PARTY_LICENSES.$lang.md
