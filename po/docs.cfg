# po4a configuration for the Traditional Chinese documentation.
#
# The .zh-TW.md pages are GENERATED from docs/locales/zh-TW.po, which is what
# Weblate maintains. Do not hand-edit a .zh-TW.md file -- run
# `scripts/update-docs-po.sh` and the edit is overwritten.
#
# Korean is deliberately NOT listed. The .ko.md pages stay hand-maintained,
# which is how upstream works; adding `ko` here would make them generated too
# and change a workflow this fork does not own.
#
# -w 9999 effectively disables output rewrapping. It matters: the default
# 76-column wrap splits an attr_list block such as
# `{ .md-button target=_blank }` or a pinned anchor `{#some-anchor}` across two
# lines, which silently stops it from being parsed as one. `-o neverwrap` is
# NOT a substitute -- it changes how blocks are segmented, so the msgids no
# longer match and it also loosens tight bullet lists.
#
# -k 80 keeps a page from being written below 80% translated: mkdocs-static-i18n
# then serves the English page whole, which reads better than a half-translated
# one.
[po4a_langs] zh-TW
[po4a_paths] po/docs/docs.pot $lang:po/docs/$lang.po
[options] opt:"-o markdown -w 9999 -k 80"

[type: text] docs/concepts/architecture.md $lang:docs/concepts/architecture.$lang.md
[type: text] docs/concepts/local-first.md $lang:docs/concepts/local-first.$lang.md
[type: text] docs/concepts/pipeline-by-input.md $lang:docs/concepts/pipeline-by-input.$lang.md
